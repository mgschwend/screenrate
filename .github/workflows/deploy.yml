name: Build data + deploy to VPS

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *' # nightly, 02:17 UTC (IMDb datasets refresh daily)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS: deploy@77.42.39.59
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install pandas numpy

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - name: Tests
        run: |
          (cd web && npm test)
          (cd server && npm test)

      - name: Build imdb.sqlite
        run: python scripts/build_imdb_db.py --akas --min-votes 1000 --out "$RUNNER_TEMP/imdb.sqlite" --cache "$RUNNER_TEMP/imdb_cache"

      - name: Add genres + similar titles
        run: python scripts/add_similar.py "$RUNNER_TEMP/imdb.sqlite" --cache "$RUNNER_TEMP/imdb_cache"

      - name: Cache TMDB→IMDb id map
        uses: actions/cache@v6
        with:
          path: .tmdb_imdb_map.json
          key: tmdb-imdb-map-${{ github.run_id }}
          restore-keys: tmdb-imdb-map-

      - name: Add Netflix availability (TMDB / JustWatch)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/add_netflix.py "$RUNNER_TEMP/imdb.sqlite" --regions CH --map-cache .tmdb_imdb_map.json

      - name: Cache TMDB languages
        uses: actions/cache@v6
        with:
          path: .tmdb_lang_cache.json
          key: tmdb-lang-${{ github.run_id }}
          restore-keys: tmdb-lang-

      - name: Add original languages (TMDB)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/add_languages.py "$RUNNER_TEMP/imdb.sqlite" --cache .tmdb_lang_cache.json

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Package release
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/data"
          cp -R web/dist "$out/web"
          mkdir "$out/server" && cp server/*.js server/package.json "$out/server/"
          cp deploy/compose.yml "$out/"
          gzip -9 -c "$RUNNER_TEMP/imdb.sqlite" > "$out/data/imdb.sqlite.gz"
          python -c "import sqlite3,json,sys; v=sqlite3.connect(sys.argv[1]).execute(\"SELECT value FROM meta WHERE key='built_at'\").fetchone()[0]; json.dump({'built_at': v}, open(sys.argv[2],'w'))" "$RUNNER_TEMP/imdb.sqlite" "$out/data/db-version.json"
          tar -czf "$RUNNER_TEMP/release.tgz" -C "$out" .

      - name: Upload to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS" < "$RUNNER_TEMP/release.tgz"
