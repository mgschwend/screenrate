name: Build data + deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday 04:17 UTC (IMDb datasets refresh daily)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install pandas numpy cryptography

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Tests (normalize parity, encryption roundtrip)
        run: npm test
        working-directory: web

      - name: Build imdb.sqlite
        run: python scripts/build_imdb_db.py --akas --min-votes 1000 --out "$RUNNER_TEMP/imdb.sqlite" --cache "$RUNNER_TEMP/imdb_cache"

      - name: Add genres + similar titles
        run: python scripts/add_similar.py "$RUNNER_TEMP/imdb.sqlite" --cache "$RUNNER_TEMP/imdb_cache"

      - name: Cache TMDB→IMDb id map
        uses: actions/cache@v6
        with:
          path: .tmdb_imdb_map.json
          key: tmdb-imdb-map-${{ github.run_id }}
          restore-keys: tmdb-imdb-map-

      - name: Add Netflix availability (TMDB / JustWatch)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/add_netflix.py "$RUNNER_TEMP/imdb.sqlite" --regions CH --map-cache .tmdb_imdb_map.json

      - name: Encrypt database
        env:
          DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
        run: |
          if [ -z "$DB_PASSPHRASE" ]; then
            echo "::error::Repo secret DB_PASSPHRASE is not set (gh secret set DB_PASSPHRASE -R ${{ github.repository }})"
            exit 1
          fi
          python scripts/encrypt_db.py "$RUNNER_TEMP/imdb.sqlite" web/public/imdb.sqlite.enc
          # tiny unencrypted version marker so installed apps notice a new DB (contains no IMDb data)
          python -c "import sqlite3,json,sys; v=sqlite3.connect(sys.argv[1]).execute(\"SELECT value FROM meta WHERE key='built_at'\").fetchone()[0]; json.dump({'built_at': v}, open('web/public/db-version.json','w'))" "$RUNNER_TEMP/imdb.sqlite"

      - name: Build web app
        run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
